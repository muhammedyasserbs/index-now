name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Site checks (docs/)
        run: python3 scripts/check_site.py

      - name: Extension checks (index-flow/)
        run: python3 scripts/check_extension.py
