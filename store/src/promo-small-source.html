<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>IndexFlow — small promo tile source</title>
<link rel="stylesheet" href="store.css">
<style>
  html, body { width: 440px; height: 280px; }
  body { background: #053960; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .wrap img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 14px 30px rgba(0,0,0,.25); }
  .word { font-size: 34px; font-weight: 800; letter-spacing: .01em; direction: ltr; }
  .tag { font-size: 16px; color: #d7ae72; font-weight: 600; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #c2924d; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="../../docs/assets/img/icon-192x192.png" alt="">
    <div class="word">IndexFlow</div>
    <div class="tag">الفهرسة الجماعية لروابط جوجل</div>
  </div>
  <div class="rule"></div>
</body>
</html>
